name: publish-gitea
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "GitHub release tag to publish (default: latest)"
        required: false
        default: latest

jobs:
  publish:
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Publish installers to Gitea
        run: |
          set -euo pipefail
          apk add --no-cache curl jq python3 >/dev/null 2>&1 || true
          tag="${RELEASE_TAG:-${GITHUB_REF#refs/tags/}}"
          if [[ -n "$tag" && "$tag" != "latest" ]]; then
            git clone -q --branch "$tag" --depth 1 http://192.168.30.33:3000/TomHanck4/dsh-easy-desktop.git repo
          else
            git clone -q --depth 1 http://192.168.30.33:3000/TomHanck4/dsh-easy-desktop.git repo
          fi
          cd repo
          RELEASE_TAG="$tag" bash scripts/publish-gitea-actions.sh
        env:
          GITEA_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          GITEA_BASE_URL: http://192.168.30.33:3000
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        working-directory: /tmp